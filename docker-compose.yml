services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: sap-architect-pgvector
    environment:
      POSTGRES_USER: architect
      POSTGRES_PASSWORD: architect
      POSTGRES_DB: architect
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U architect -d architect"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Draw.io editor embedded in the studio. Self-hosted so architecture diagrams
  # never leave the network — the public embed.diagrams.net would work identically.
  drawio:
    image: jgraph/drawio:latest
    container_name: sap-architect-drawio
    environment:
      DRAWIO_SELF_CONTAINED: "1"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
