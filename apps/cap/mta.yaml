_schema-version: "3.1"
ID: sap-architect-builder
version: 0.1.0
description: SAP Architect Builder — CAP API with XSUAA on BTP

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install --prefix ../..
        - npm run build --prefix ../..
        - npx cds build --production

modules:
  - name: architect-builder-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: architect-builder-uaa
      - name: architect-builder-db
      # Optional: bind Object Store / Destination / Generative AI Hub later
    properties:
      LLM_PROVIDER: mock
      PIPELINE_ENGINE: langgraph
      REQUIRE_HUMAN_REVIEW: true

  - name: architect-builder-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: architect-builder-db

resources:
  - name: architect-builder-uaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: sap-architect-builder-${org}-${space}
        tenant-mode: dedicated

  - name: architect-builder-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    # For local-only prototypes without HANA, use sqlite via cds deploy instead.
